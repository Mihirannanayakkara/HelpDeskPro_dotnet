name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HelpDeskPro.Tests/HelpDeskPro.Tests.csproj

      - name: Build
        run: dotnet build HelpDeskPro.Tests/HelpDeskPro.Tests.csproj --no-restore -c Release

      - name: Test
        run: dotnet test HelpDeskPro.Tests/HelpDeskPro.Tests.csproj --no-build -c Release

  docker:
    runs-on: ubuntu-latest
    needs: test # only runs if the tests passed
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t helpdeskpro-api .

  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$HOOK"